
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bitácora — María José Ardiles</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #faf9f7;
      color: #24211f;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    header {
      width: 100%;
      padding: 28px 5vw;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nombre {
      color: #24211f;
      text-decoration: none;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .menu {
      display: flex;
      gap: 30px;
      list-style: none;
    }

    .menu a {
      position: relative;
      color: #24211f;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.4px;
      transition: opacity 0.3s ease;
    }

    .menu a:hover {
      opacity: 0.5;
    }

    .menu .activo::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -5px;
      height: 1px;
      background: #24211f;
    }

    main {
      width: 90vw;
      max-width: 1100px;
      margin: 0 auto;
    }

    .hero {
      padding: 130px 0 110px;
    }

    .etiqueta {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #77716c;
      margin-bottom: 25px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(44px, 6vw, 78px);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -2px;
      max-width: 800px;
    }

    .subtitulo {
      margin-top: 28px;
      font-size: 13px;
      color: #77716c;
      letter-spacing: 0.4px;
    }

    .encargos {
      border-top: 1px solid #d9d5d0;
    }

    .encargo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 32px 0;
      border-bottom: 1px solid #d9d5d0;
      text-decoration: none;
      color: #24211f;
      transition: padding 0.3s ease;
    }

    .encargo:hover {
      padding-left: 12px;
      padding-right: 12px;
    }

    .encargo-info {
      display: flex;
      align-items: baseline;
      gap: 28px;
    }

    .numero {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      color: #77716c;
    }

    .titulo-encargo {
      font-size: 16px;
      font-weight: 400;
    }

    .flecha {
      font-size: 18px;
      font-weight: 300;
    }

    footer {
      width: 90vw;
      max-width: 1100px;
      margin: 100px auto 40px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #8a847e;
      letter-spacing: 0.4px;
    }

    @media (max-width: 600px) {
      header {
        padding: 24px 5vw;
      }

      .menu {
        gap: 16px;
      }

      .menu a {
        font-size: 11px;
      }

      .hero {
        padding: 90px 0 80px;
      }

      .encargo-info {
        gap: 18px;
      }

      footer {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>

<body>

  <header>
    <nav class="nav">

      <a href="index.html" class="nombre">
        María José Ardiles
      </a>

      <ul class="menu">

        <li>
          <a href="index.html" class="activo">
            Inicio
          </a>
        </li>

        <li>
          <a href="./encargos%203.html">
            Encargo 3
          </a>
        </li>

        <li>
          <a href="encargo 4.html">
            Encargo 4
          </a>
        </li>

      </ul>
    </nav>
  </header>

  <main>

    <section class="hero">

      <p class="etiqueta">
        Bitácora de clases 
      </p>

      <h1>
        Encargos
      </h1>

      <p class="subtitulo">
        María José Ardiles · 2026
      </p>

    </section>

    <section class="encargos">

      <!-- ENCARGO 3 -->
      <a href="./encargos%203.html" class="encargo">

        <div class="encargo-info">
          <span class="numero">03</span>
          <span class="titulo-encargo">Encargo 3</span>
        </div>

        <span class="flecha">→</span>

      </a>

      <!-- ENCARGO 4 -->
      <a href="encargo 4.html" class="encargo">

        <div class="encargo-info">
          <span class="numero">04</span>
          <span class="titulo-encargo">Encargo 4</span>
        </div>

        <span class="flecha">→</span>

      </a>

    </section>

  </main>

  <footer>
    <span>María José Ardiles</span>
    <span>Bitácora de encargos</span>
  </footer>

</body>
</html>
